<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 506" role="img" aria-label="Synthesis noise: renaming signals and relaxing the clock changed nothing, two equivalent ALU rewrites added 872 and 1005 LUTs, and one untouched cone read minus 1.50, minus 1.46, plus 0.50 and minus 1.83 ns across four checkpoints">
<style>text{font-family:system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#e6eaf2;font-size:14.5px}.d{fill:#9aa6bd;font-size:13.5px}.h{font-size:16px;font-weight:600}.b{font-weight:600}.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px}.c{text-anchor:middle}.e{text-anchor:end}.o{fill:#f0a35e}.g{fill:#6fcf97}.bl{fill:#7aa2ff}</style>
<defs><marker id="ad" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9aa6bd"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7aa2ff"/></marker><marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f0a35e"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6fcf97"/></marker></defs>
<rect width="560" height="506" rx="10" fill="#1b2132" stroke="#2c3550"/>
<text class="h" x="24" y="32">How much Vivado moves when I change nothing real</text>
<text class="b" x="24" y="66">Changes that should be no-ops: LUT change</text>
<text class="" x="24" y="99">Rename some signals</text>
<rect x="214" y="84" width="3" height="20" fill="#6fcf97"/>
<text class="g" x="224" y="100">0: identical netlist, 18,888 LUTs</text>
<text class="" x="24" y="133">Relax clock to 14 and 20 ns</text>
<rect x="214" y="118" width="3" height="20" fill="#6fcf97"/>
<text class="g" x="224" y="134">0: same netlist as at 10 ns</text>
<text class="" x="24" y="167">SLTU as a 33-bit subtract</text>
<rect x="214" y="152" width="216.9" height="20" rx="3" fill="#f0a35e" fill-opacity="0.85"/>
<text class="o b" x="438.9" y="168">+872</text>
<text class="" x="24" y="201">SLT with a sign flip</text>
<rect x="214" y="186" width="250.0" height="20" rx="3" fill="#f0a35e" fill-opacity="0.85"/>
<text class="o b" x="472.0" y="202">+1,005</text>
<text class="d" x="24" y="236">The two rewrites are exactly equivalent to what they replaced. Cone delays</text>
<text class="d" x="24" y="254">moved by −1.75 to +1.8 ns, and the untouched fetch cones got 0.7 to 1.8 ns worse.</text>
<text class="b" x="24" y="298">One memory queue selector cone that nobody touched: WNS (ns)</text>
<path d="M60 372L536 372" stroke="#9aa6bd" stroke-width="1.2" fill="none"/>
<text class="d e" x="536" y="366">0 ns: meets 10 ns clock</text>
<path d="M120 372L120 423.0" stroke="#f0a35e" stroke-width="2" fill="none"/>
<circle cx="120" cy="423.0" r="6.5" fill="#f0a35e"/>
<text class="c b" x="120" y="445.0">−1.50</text>
<text class="d c" x="120" y="486">checkpoint 1</text>
<path d="M230 372L230 421.64" stroke="#f0a35e" stroke-width="2" fill="none"/>
<circle cx="230" cy="421.64" r="6.5" fill="#f0a35e"/>
<text class="c b" x="230" y="443.64">−1.46</text>
<text class="d c" x="230" y="486">checkpoint 2</text>
<path d="M340 372L340 355.0" stroke="#6fcf97" stroke-width="2" fill="none"/>
<circle cx="340" cy="355.0" r="6.5" fill="#6fcf97"/>
<text class="c b" x="340" y="343.0">+0.50</text>
<text class="d c" x="340" y="486">checkpoint 3</text>
<path d="M450 372L450 434.22" stroke="#f0a35e" stroke-width="2" fill="none"/>
<circle cx="450" cy="434.22" r="6.5" fill="#f0a35e"/>
<text class="c b" x="450" y="456.22">−1.83</text>
<text class="d c" x="450" y="486">checkpoint 4</text>
</svg>
