<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 462" width="1040" height="462" role="img" aria-labelledby="ttl desc">
<title id="ttl">Specula instruction lifecycle: execute, writeback, retire</title>
<desc id="desc">Arithmetic and branch instructions go from the reservation station through the ALU, multiplier and divider to writeback. Memory operations go from the memory queue through address generation and memory issue, using the store queue for store-to-load forwarding, to a result that goes to writeback. Writeback writes the physical register file and marks the reorder buffer entry done. The reorder buffer commits in order; stores are written to memory only at commit, and a mispredicted branch at the head triggers a flush and fetch redirect.</desc>
<defs><marker id="m-flow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 z" fill="#a9b5cb"/></marker><marker id="m-res" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 z" fill="#5ccfa5"/></marker><marker id="m-ret" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 z" fill="#f2b45f"/></marker><marker id="m-rec" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 z" fill="#ff7b88"/></marker>
<style>
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
.t{font-size:14px;font-weight:600;fill:#e6eef8} .s{font-size:11px;fill:#9aa9c2}
.c{font-size:11.5px;font-weight:600;fill:#e6eef8} .cs{font-size:9.5px;fill:#9aa9c2}
.h{font-size:11px;font-weight:700;letter-spacing:.08em}
.l{font-size:10px;paint-order:stroke;stroke:#171c28;stroke-width:4px;stroke-linejoin:round}
</style></defs>
<rect width="1040" height="462" rx="12" fill="#171c28"/>
<text class="h" x="24" y="28" text-anchor="start" fill="#7aa2ff">EXECUTE</text>
<text class="h" x="636" y="28" text-anchor="start" fill="#5ccfa5">WRITEBACK</text>
<text class="h" x="830" y="28" text-anchor="start" fill="#f2b45f">RETIRE</text>
<rect x="24" y="50" width="140" height="70" rx="8" fill="#1e2638" stroke="#7aa2ff" stroke-width="1.6"/>
<text class="t" x="94.0" y="90.0" text-anchor="middle"></text>
<text class="t" x="94" y="82" text-anchor="middle">Reservation</text>
<text class="t" x="94" y="100" text-anchor="middle">Station</text>
<rect x="188" y="50" width="304" height="70" rx="8" fill="#1e2638" stroke="#5ccfa5" stroke-width="1.6"/>
<text class="t" x="340" y="67" text-anchor="middle">Execution unit</text>
<rect x="200" y="78" width="88" height="30" rx="5" fill="#262f47"/>
<text class="c" x="244.0" y="97.0" text-anchor="middle">ALU</text>
<rect x="298" y="78" width="88" height="30" rx="5" fill="#262f47"/>
<text class="c" x="342.0" y="97.0" text-anchor="middle">Multiplier</text>
<rect x="396" y="78" width="88" height="30" rx="5" fill="#262f47"/>
<text class="c" x="440.0" y="97.0" text-anchor="middle">Divider</text>
<path d="M164,85 H188" fill="none" stroke="#a9b5cb" stroke-width="1.5" marker-end="url(#m-flow)" stroke-linejoin="round"/>
<rect x="24" y="150" width="140" height="70" rx="8" fill="#1e2638" stroke="#7aa2ff" stroke-width="1.6"/>
<text class="t" x="94.0" y="182.0" text-anchor="middle">Memory Queue</text>
<text class="s" x="94.0" y="199.0" text-anchor="middle">8 entries</text>
<rect x="188" y="150" width="140" height="70" rx="8" fill="#1e2638" stroke="#5ccfa5" stroke-width="1.6"/>
<text class="t" x="258.0" y="182.0" text-anchor="middle">Address Gen</text>
<text class="s" x="258.0" y="199.0" text-anchor="middle">translate</text>
<rect x="352" y="150" width="140" height="70" rx="8" fill="#1e2638" stroke="#5ccfa5" stroke-width="1.6"/>
<text class="t" x="422.0" y="182.0" text-anchor="middle">Memory Issue</text>
<text class="s" x="422.0" y="199.0" text-anchor="middle">forward or read</text>
<rect x="516" y="150" width="90" height="70" rx="8" fill="#1e2638" stroke="#5ccfa5" stroke-width="1.6"/>
<text class="t" x="561.0" y="182.0" text-anchor="middle">Result</text>
<text class="s" x="561.0" y="199.0" text-anchor="middle">load · store</text>
<path d="M164,185 H188" fill="none" stroke="#a9b5cb" stroke-width="1.5" marker-end="url(#m-flow)" stroke-linejoin="round"/>
<path d="M328,185 H352" fill="none" stroke="#a9b5cb" stroke-width="1.5" marker-end="url(#m-flow)" stroke-linejoin="round"/>
<path d="M492,185 H516" fill="none" stroke="#a9b5cb" stroke-width="1.5" marker-end="url(#m-flow)" stroke-linejoin="round"/>
<rect x="188" y="256" width="140" height="60" rx="8" fill="#1e2638" stroke="#c3cee3" stroke-width="1.6"/>
<text class="t" x="258.0" y="283.0" text-anchor="middle">Store Queue</text>
<text class="s" x="258.0" y="300.0" text-anchor="middle">held until commit</text>
<path d="M258,220 V256" fill="none" stroke="#a9b5cb" stroke-width="1.5" marker-end="url(#m-flow)" stroke-linejoin="round"/>
<text class="l" x="266" y="242" text-anchor="start" fill="#a9b5cb">addr + data</text>
<path d="M328,286 H380 V220" fill="none" stroke="#a9b5cb" stroke-width="1.5" marker-end="url(#m-flow)" stroke-linejoin="round"/>
<text class="l" x="388" y="254" text-anchor="start" fill="#a9b5cb">store-to-load forward</text>
<rect x="636" y="50" width="140" height="170" rx="8" fill="#1e2638" stroke="#5ccfa5" stroke-width="1.6"/>
<text class="t" x="706.0" y="140.0" text-anchor="middle"></text>
<text class="t" x="706" y="76" text-anchor="middle">Writeback</text>
<text class="s" x="706" y="120" text-anchor="middle">write result to PRF</text>
<text class="s" x="706" y="142" text-anchor="middle">wake dependents</text>
<text class="s" x="706" y="164" text-anchor="middle">mark ROB entry done</text>
<path d="M492,85 H636" fill="none" stroke="#5ccfa5" stroke-width="1.5" marker-end="url(#m-res)" stroke-linejoin="round"/>
<path d="M606,185 H636" fill="none" stroke="#5ccfa5" stroke-width="1.5" marker-end="url(#m-res)" stroke-linejoin="round"/>
<rect x="830" y="50" width="186" height="70" rx="8" fill="#1e2638" stroke="#c3cee3" stroke-width="1.6"/>
<text class="t" x="923.0" y="82.0" text-anchor="middle">Physical Register File</text>
<text class="s" x="923.0" y="99.0" text-anchor="middle">64 registers</text>
<path d="M776,85 H830" fill="none" stroke="#5ccfa5" stroke-width="1.5" marker-end="url(#m-res)" stroke-linejoin="round"/>
<text class="l" x="803" y="78" text-anchor="middle" fill="#5ccfa5">result</text>
<rect x="830" y="150" width="186" height="90" rx="8" fill="#1e2638" stroke="#f2b45f" stroke-width="1.6"/>
<text class="t" x="923.0" y="200.0" text-anchor="middle"></text>
<text class="t" x="923" y="176" text-anchor="middle">Reorder Buffer</text>
<text class="s" x="923" y="194" text-anchor="middle">32 entries</text>
<text class="s" x="923" y="214" text-anchor="middle">complete in any order</text>
<path d="M776,185 H830" fill="none" stroke="#5ccfa5" stroke-width="1.5" marker-end="url(#m-res)" stroke-linejoin="round"/>
<text class="l" x="803" y="178" text-anchor="middle" fill="#5ccfa5">done</text>
<rect x="830" y="290" width="186" height="60" rx="8" fill="#1e2638" stroke="#f2b45f" stroke-width="1.6"/>
<text class="t" x="923.0" y="317.0" text-anchor="middle">In-order commit</text>
<text class="s" x="923.0" y="334.0" text-anchor="middle">oldest first</text>
<path d="M923,240 V290" fill="none" stroke="#f2b45f" stroke-width="1.5" marker-end="url(#m-ret)" stroke-linejoin="round"/>
<rect x="560" y="290" width="190" height="60" rx="8" fill="#1e2638" stroke="#c3cee3" stroke-width="1.6"/>
<text class="t" x="655.0" y="317.0" text-anchor="middle">Architectural state</text>
<text class="s" x="655.0" y="334.0" text-anchor="middle">registers · memory</text>
<path d="M830,320 H750" fill="none" stroke="#f2b45f" stroke-width="1.5" marker-end="url(#m-ret)" stroke-linejoin="round"/>
<text class="l" x="790" y="310" text-anchor="middle" fill="#f2b45f">stores → memory</text>
<rect x="830" y="384" width="186" height="52" rx="8" fill="#1e2638" stroke="#ff7b88" stroke-width="1.6"/>
<text class="t" x="923" y="406" text-anchor="middle">Mispredict at head</text>
<text class="s" x="923" y="423" text-anchor="middle">flush · redirect fetch</text>
<path d="M923,350 V384" fill="none" stroke="#ff7b88" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#m-rec)" stroke-linejoin="round"/>
</svg>