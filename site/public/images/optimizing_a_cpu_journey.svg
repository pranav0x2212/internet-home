<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 477" role="img" aria-label="Horizontal bar chart of estimated Fmax at each optimization checkpoint, rising from 11.9 MHz to 98.9 MHz, with two reverted experiments drawn as dashed bars">
<style>text{font-family:system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#e6eaf2;font-size:14.5px}.d{fill:#9aa6bd;font-size:13.5px}.h{font-size:16px;font-weight:600}.b{font-weight:600}.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px}.c{text-anchor:middle}.e{text-anchor:end}.o{fill:#f0a35e}.g{fill:#6fcf97}.bl{fill:#7aa2ff}</style>
<defs><marker id="ad" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9aa6bd"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7aa2ff"/></marker><marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f0a35e"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6fcf97"/></marker></defs>
<rect width="560" height="477" rx="10" fill="#1b2132" stroke="#2c3550"/>
<text class="h" x="24" y="32">Estimated Fmax at each checkpoint (MHz)</text>
<text class="d" x="24" y="52">Solid bars were kept. Dashed bars were tried and reverted.</text>
<path d="M256.0 84L256.0 443" stroke="#2c3550" stroke-width="1" fill="none"/>
<text class="d c" x="256.0" y="78">0</text>
<path d="M316.0 84L316.0 443" stroke="#2c3550" stroke-width="1" fill="none"/>
<text class="d c" x="316.0" y="78">25</text>
<path d="M376.0 84L376.0 443" stroke="#2c3550" stroke-width="1" fill="none"/>
<text class="d c" x="376.0" y="78">50</text>
<path d="M436.0 84L436.0 443" stroke="#2c3550" stroke-width="1" fill="none"/>
<text class="d c" x="436.0" y="78">75</text>
<path d="M496.0 84L496.0 443" stroke="#2c3550" stroke-width="1" fill="none"/>
<text class="d c" x="496.0" y="78">100</text>
<path d="M472.0 84L472.0 443" stroke="#6fcf97" stroke-width="1.4" fill="none" stroke-dasharray="4 4"/>
<text class="d g c" x="462.0" y="459">90 MHz target</text>
<text x="24" y="109">Single-cycle divider (baseline)</text>
<rect x="256" y="96" width="28.6" height="18" rx="3" fill="#7aa2ff" fill-opacity="0.85"/>
<text class="b" x="290.6" y="110">11.9</text>
<text x="24" y="136">Iterative 32-cycle divider</text>
<rect x="256" y="123" width="42.3" height="18" rx="3" fill="#7aa2ff" fill-opacity="0.85"/>
<text class="b" x="304.3" y="137">17.6</text>
<text x="24" y="163">Balanced tree for oldest entry</text>
<rect x="256" y="150" width="53.5" height="18" rx="3" fill="#7aa2ff" fill-opacity="0.85"/>
<text class="b" x="315.5" y="164">22.3</text>
<text x="24" y="190">Balanced tree, forwarding merge</text>
<rect x="256" y="177" width="63.7" height="18" rx="3" fill="#7aa2ff" fill-opacity="0.85"/>
<text class="b" x="325.7" y="191">26.5</text>
<text class="d" x="24" y="217">↳ ROB 64 → 32 entries: saves area, no WNS recorded</text>
<text x="24" y="244">Queue positions, not ROB tags</text>
<rect x="256" y="231" width="77.7" height="18" rx="3" fill="#7aa2ff" fill-opacity="0.85"/>
<text class="b" x="339.7" y="245">32.4</text>
<text x="24" y="271">Select / issue split</text>
<rect x="256" y="258" width="141.2" height="18" rx="3" fill="#7aa2ff" fill-opacity="0.85"/>
<text class="b" x="403.2" y="272">58.8</text>
<text x="24" y="298">AGU split (doMemAgu)</text>
<rect x="256" y="285" width="150.9" height="18" rx="3" fill="#7aa2ff" fill-opacity="0.85"/>
<text class="b" x="412.9" y="299">62.9</text>
<text class="d" x="24" y="325">Register paging flag</text>
<rect x="256" y="312" width="152.0" height="18" rx="3" fill="#f0a35e" fill-opacity="0.12" stroke="#f0a35e" stroke-width="1.4" stroke-dasharray="5 3"/>
<text class="o" x="414.0" y="326">63.3</text>
<text class="o c" style="font-size:12px" x="332.0" y="325">reverted</text>
<text x="24" y="352">Gate the fault, not the data</text>
<rect x="256" y="339" width="214.5" height="18" rx="3" fill="#7aa2ff" fill-opacity="0.85"/>
<text class="b" x="476.5" y="353">89.4</text>
<text class="d" x="24" y="379">Root check moved to fault term</text>
<rect x="256" y="366" width="187.5" height="18" rx="3" fill="#f0a35e" fill-opacity="0.12" stroke="#f0a35e" stroke-width="1.4" stroke-dasharray="5 3"/>
<text class="o" x="449.5" y="380">78.1</text>
<text class="o c" style="font-size:12px" x="349.8" y="379">reverted</text>
<text x="24" y="406">sqExecd[1] → sqExecd[0]</text>
<rect x="256" y="393" width="227.0" height="18" rx="3" fill="#7aa2ff" fill-opacity="0.85"/>
<text class="b" x="489.0" y="407">94.6</text>
<text x="24" y="433">DSP48E1 PREG on multiplier</text>
<rect x="256" y="420" width="237.3" height="18" rx="3" fill="#7aa2ff" fill-opacity="0.85"/>
<text class="b" x="499.3" y="434">98.9</text>
</svg>
