<text class="c " x="389.0" y="80.0">LUT</text>
<path d="M318 75L350 75" stroke="#9aa6bd" stroke-width="1.6" fill="none" marker-end="url(#ad)"/>
<text class="d c" x="334" y="66">wire</text>
