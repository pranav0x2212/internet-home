<marker id="ms-flow" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M9,1 L1,5 L9,9 z" fill="#a9b5cb"/></marker>
<marker id="m-rec" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 z" fill="#ff7b88"/></marker>
<marker id="ms-rec" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M9,1 L1,5 L9,9 z" fill="#ff7b88"/></marker>
<marker id="m-wake" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 z" fill="#5ccfa5"/></marker>
