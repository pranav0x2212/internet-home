<marker id="m-train" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 z" fill="#7aa2ff"/></marker>
<marker id="ms-train" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M9,1 L1,5 L9,9 z" fill="#7aa2ff"/></marker>
<marker id="m-ifetch" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 z" fill="#7d889c"/></marker>
<marker id="ms-ifetch" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M9,1 L1,5 L9,9 z" fill="#7d889c"/></marker>
