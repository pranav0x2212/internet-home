<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 770" width="1040" height="770" role="img" aria-labelledby="ttl desc">
<title id="ttl">Specula microarchitecture block diagram</title>
<desc id="desc">Block diagram of the Specula out-of-order RV32 core: fetch with branch predictor, decode, rename, dispatch into a reservation station and a memory queue, an execution unit and a load/store unit sharing a physical register file, a reorder buffer that commits in order, and a system bus to RAM and peripherals.</desc>
