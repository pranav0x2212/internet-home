<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330" role="img" aria-label="Fetch loop before and after: the root-in-RAM check gated the page table entry data path, taking the path from 11.97 ns to 6.85 ns once only the fault signal is gated">
<style>text{font-family:system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#e6eaf2;font-size:14.5px}.d{fill:#9aa6bd;font-size:13.5px}.h{font-size:16px;font-weight:600}.b{font-weight:600}.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px}.c{text-anchor:middle}.e{text-anchor:end}.o{fill:#f0a35e}.g{fill:#6fcf97}.bl{fill:#7aa2ff}</style>
<defs><marker id="ad" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9aa6bd"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7aa2ff"/></marker><marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f0a35e"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6fcf97"/></marker></defs>
<rect width="560" height="330" rx="10" fill="#1b2132" stroke="#2c3550"/>
<text class="h" x="24" y="32">The check was gating data the fault path already covered</text>
<text class="b o" x="24" y="66">Before: the root check masks the data  (11.97 ns to the PC)</text>
<rect x="24" y="80" width="104" height="48" rx="5" fill="#4a3523" stroke="#f0a35e" stroke-width="1.2"/>
<text class="c " x="76.0" y="100.5">root-in-RAM</text>
<text class="c d" x="76.0" y="117.5">check</text>
<rect x="160" y="80" width="104" height="48" rx="5" fill="#4a3523" stroke="#f0a35e" stroke-width="1.2"/>
<text class="c " x="212.0" y="100.5">mask page</text>
<text class="c d" x="212.0" y="117.5">table entry</text>
<path d="M128 104L160 104" stroke="#f0a35e" stroke-width="1.6" fill="none" marker-end="url(#ao)"/>
<rect x="296" y="80" width="104" height="48" rx="5" fill="#252d44" stroke="#3a4668" stroke-width="1.2"/>
<text class="c " x="348.0" y="100.5">translate +</text>
<text class="c d" x="348.0" y="117.5">JAL offset add</text>
<path d="M264 104L296 104" stroke="#9aa6bd" stroke-width="1.6" fill="none" marker-end="url(#ad)"/>
<rect x="432" y="80" width="104" height="48" rx="5" fill="#252d44" stroke="#3a4668" stroke-width="1.2"/>
<text class="c " x="484.0" y="109.0">next PC</text>
<path d="M400 104L432 104" stroke="#9aa6bd" stroke-width="1.6" fill="none" marker-end="url(#ad)"/>
<text class="b g" x="24" y="170">After: only the fault signal is gated  (6.85 ns)</text>
<rect x="24" y="184" width="104" height="48" rx="5" fill="#1f4032" stroke="#6fcf97" stroke-width="1.2"/>
<text class="c " x="76.0" y="204.5">root-in-RAM</text>
<text class="c d" x="76.0" y="221.5">check</text>
<path d="M128 208L160 208" stroke="#6fcf97" stroke-width="1.6" fill="none" marker-end="url(#ag)"/>
<rect x="160" y="184" width="104" height="48" rx="5" fill="#1f4032" stroke="#6fcf97" stroke-width="1.2"/>
<text class="c " x="212.0" y="204.5">fault</text>
<text class="c d" x="212.0" y="221.5">signal</text>
<text class="d" x="280" y="201">the fault path already tracked</text>
<text class="d" x="280" y="219">exactly this, so the check stays</text>
<rect x="24" y="246" width="104" height="48" rx="5" fill="#252d44" stroke="#3a4668" stroke-width="1.2"/>
<text class="c " x="76.0" y="266.5">page table</text>
<text class="c d" x="76.0" y="283.5">entry (ungated)</text>
<path d="M128 270L160 270" stroke="#9aa6bd" stroke-width="1.6" fill="none" marker-end="url(#ad)"/>
<rect x="160" y="246" width="104" height="48" rx="5" fill="#252d44" stroke="#3a4668" stroke-width="1.2"/>
<text class="c " x="212.0" y="266.5">translate +</text>
<text class="c d" x="212.0" y="283.5">JAL offset add</text>
<path d="M264 270L296 270" stroke="#9aa6bd" stroke-width="1.6" fill="none" marker-end="url(#ad)"/>
<rect x="296" y="246" width="104" height="48" rx="5" fill="#252d44" stroke="#3a4668" stroke-width="1.2"/>
<text class="c " x="348.0" y="275.0">next PC</text>
<text class="d" x="416" y="265">identical behaviour,</text>
<text class="d" x="416" y="283">cycle for cycle</text>
</svg>
