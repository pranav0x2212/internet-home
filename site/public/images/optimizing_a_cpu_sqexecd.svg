<text class="d" x="24" y="448">The address stage is no longer upstream of load selection.</text>
<text class="b" x="24" y="486">Why it is safe: a store's bit only ever goes from 0 to 1</text>
<text class="d c" x="293.0" y="512">cycle N−1</text>
