<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 652" role="img" aria-label="Before, the store address stage fed sqExecd through the CReg port 1 bypass into the load select logic in one cycle. After, port 0 reads last cycle's registered value, which can delay a load by one cycle but never release it early">
