<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 310" width="100%" style="max-width:1000px;height:auto" role="img" aria-labelledby="ttl desc">
<title id="ttl">Specula memory pipeline</title>
<desc id="desc">Memory operations flow from the Memory Queue through select, address generation, issue and writeback. Select, address generation and issue are separated by stage registers, and a result FIFO sits between issue and writeback. Address generation reads the physical register file and translates through the MMU. Issue consults the store queue and memory. Writeback completes the reorder buffer, writes the physical register file and wakes the reservation station.</desc>
