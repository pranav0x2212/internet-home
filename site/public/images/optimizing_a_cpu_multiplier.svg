<rect x="28" y="92" width="86" height="50" rx="5" fill="#252d44" stroke="#3a4668" stroke-width="1.2"/>
<text class="c " x="71.0" y="113.5">ALU</text>
<text class="c d" x="71.0" y="130.5">operands</text>
