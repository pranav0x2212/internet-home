<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 512" role="img" aria-label="Multiplier path before and after the DSP48E1 PREG stage: before, the product reaches the response queue in the same cycle; after, it is registered in cycle t and drained into the response queue in cycle t+1">
