<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 420" width="100%" style="max-width:1100px;height:auto" role="img" aria-labelledby="ttl desc">
<title id="ttl">Specula frontend and dispatch structures</title>
<desc id="desc">Two separate groups. Frontend: instruction fetch uses registered paging and root-in-RAM state; the Sv32 translation yields a physical address; the fetched parcel goes through predecode, whose control-flow information returns to fetch. Dispatch: the physical register free list feeds a balanced 8 by 8 picker that selects an available register; allocation supplies the destination tag that dispatch places in the reservation station entry.</desc>
<defs>
<marker id="m-flow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 z" fill="#a9b5cb"/></marker>
<marker id="m-cmp" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 z" fill="#f2b45f"/></marker>
<marker id="m-out" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 z" fill="#5ccfa5"/></marker>
<marker id="m-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 z" fill="#7aa2ff"/></marker>
<marker id="m-cyan" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 z" fill="#6fd3e8"/></marker>
<marker id="m-pur" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 z" fill="#b59bff"/></marker>
<style>
