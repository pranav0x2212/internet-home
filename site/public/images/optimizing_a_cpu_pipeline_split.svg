<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330" role="img" aria-label="The memory pipeline before and after the split: one issue stage doing register read, address add, translation, store queue update, forwarding, extraction and enqueue, versus doMemAgu followed by doMemIssue with a pipeline register between them">
<style>text{font-family:system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#e6eaf2;font-size:14.5px}.d{fill:#9aa6bd;font-size:13.5px}.h{font-size:16px;font-weight:600}.b{font-weight:600}.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px}.c{text-anchor:middle}.e{text-anchor:end}.o{fill:#f0a35e}.g{fill:#6fcf97}.bl{fill:#7aa2ff}</style>
<defs><marker id="ad" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9aa6bd"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7aa2ff"/></marker><marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f0a35e"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6fcf97"/></marker></defs>
<rect width="560" height="330" rx="10" fill="#1b2132" stroke="#2c3550"/>
<text class="h" x="24" y="32">Cutting the memory issue stage in two</text>
<text class="b o" x="24" y="64">Before: one issue stage does everything</text>
<rect x="24" y="76" width="110" height="84" rx="5" fill="#252d44" stroke="#3a4668" stroke-width="1.2"/>
<text class="c " x="79.0" y="114.5">select</text>
<text class="c d" x="79.0" y="131.5">stage</text>
<path d="M134 118L146 118" stroke="#9aa6bd" stroke-width="1.6" fill="none" marker-end="url(#ad)"/>
<rect x="146" y="76" width="390" height="84" rx="5" fill="#4a3523" stroke="#f0a35e" stroke-width="1.2"/>
<text class="c " x="341.0" y="106.0">issue stage</text>
<text class="c d" x="341.0" y="123.0">reg read, base + offset add, Sv32 translate,</text>
<text class="c d" x="341.0" y="140.0">store queue update, forward, extract, enqueue</text>
<text class="b g" x="24" y="196">After: address work and data work get a cycle each</text>
<rect x="24" y="208" width="110" height="84" rx="5" fill="#252d44" stroke="#3a4668" stroke-width="1.2"/>
<text class="c " x="79.0" y="246.5">select</text>
<text class="c d" x="79.0" y="263.5">stage</text>
<path d="M134 250L146 250" stroke="#9aa6bd" stroke-width="1.6" fill="none" marker-end="url(#ad)"/>
<rect x="146" y="208" width="176" height="84" rx="5" fill="#1f4032" stroke="#6fcf97" stroke-width="1.2"/>
<text class="c " x="234.0" y="229.5">doMemAgu</text>
<text class="c d" x="234.0" y="246.5">reg read, base + offset add,</text>
<text class="c d" x="234.0" y="263.5">Sv32 translate,</text>
<text class="c d" x="234.0" y="280.5">store queue update</text>
<rect x="330" y="208" width="10" height="84" rx="2" fill="#7aa2ff"/>
<text class="d c" x="335" y="310">pipeline register</text>
<rect x="348" y="208" width="188" height="84" rx="5" fill="#1f4032" stroke="#6fcf97" stroke-width="1.2"/>
<text class="c " x="442.0" y="238.0">doMemIssue</text>
<text class="c d" x="442.0" y="255.0">forward, load,</text>
<text class="c d" x="442.0" y="272.0">extract, enqueue</text>
</svg>
