{{ define "all-tags"}}
{{$PageData := .TemplateData}}
{{ template "head" .}}

<body class="site-body">
    {{template "header" .}}
    <main class="container site-main" role="main">
        <article class="content">
            <h1 class="collection-title">Tags</h1>
            <div id="tag-graph" class="tag-graph"></div>
            <section class="posts">
                <div class="all-tags">
                    {{range .TagNames}}
                    <a href="/tags/{{.}}.html">{{.}}</a>
                    {{end}}
                </div>
            </section>
        </article>
    </main>

    <script defer src="/static/js/tag-graph.js"></script>

    {{template "footer" .}}

</body>

</html>

{{ end}}
