<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="100%" style="max-width:1200px;height:auto" role="img" aria-labelledby="ttl desc">
<title id="ttl">Store Queue forwarding and store-ordering optimization</title>
<desc id="desc">Panel A: a 32-bit load needs four byte lanes. Two older stores in the 8-entry Store Queue overlap; for each byte lane the youngest matching older store supplies the byte, and the four bytes are merged into the forwarded word. An inset contrasts the old serial bestAge and merged chain with the new balanced fwdPick comparison tree. Panel B: store ordering moves from ROB-tag age arithmetic plus an 8-way lookup of the executing store to Store Queue position relative to sqHead, using the load saved sqWm watermark; stores in slots from sqHead up to sqWm are older than the load. Stores write memory only at commit.</desc>
