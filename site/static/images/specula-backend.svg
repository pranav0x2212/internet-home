<text class="l" x="638" y="260" text-anchor="start" fill="#5ccfa5">result</text>
<path d="M320,188 V160" fill="none" stroke="#5ccfa5" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#m-res)" stroke-linejoin="round"/>
<text class="l" x="328" y="177" text-anchor="start" fill="#5ccfa5">wakeup</text>
<path d="M320,242 V270" fill="none" stroke="#a9b5cb" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#m-flow)" stroke-linejoin="round"/>
<text class="l" x="328" y="261" text-anchor="start" fill="#a9b5cb">ready bits</text>
<path d="M670,115 H740" fill="none" stroke="#5ccfa5" stroke-width="1.5" marker-end="url(#m-res)" stroke-linejoin="round"/>
<text class="l" x="705" y="108" text-anchor="middle" fill="#5ccfa5">done</text>
<path d="M670,315 H740" fill="none" stroke="#5ccfa5" stroke-width="1.5" marker-end="url(#m-res)" stroke-linejoin="round"/>
<text class="l" x="705" y="308" text-anchor="middle" fill="#5ccfa5">done</text>
<path d="M878,330 V372" fill="none" stroke="#f2b45f" stroke-width="1.5" marker-end="url(#m-ret)" stroke-linejoin="round"/>
<rect x="740" y="372" width="276" height="48" rx="8" fill="#192031" stroke="#f2b45f" stroke-width="1.6"/>
<text class="t" x="878" y="392" text-anchor="middle">Retire in program order</text>
<text class="s" x="878" y="409" text-anchor="middle">frees old register · commits stores</text>
</svg>