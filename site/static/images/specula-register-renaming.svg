<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 270" width="1040" height="270" role="img" aria-labelledby="ttl desc">
<title id="ttl">Register renaming example</title>
<desc id="desc">Three instructions renamed from architectural to physical registers. I1 writes x5 and is given p8. I2 reads x5, which maps to p8, so the true RAW dependency remains. I3 also writes x5 but is given p10, so the WAW dependency on x5 disappears.</desc>
<defs><marker id="m-flow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 z" fill="#a9b5cb"/></marker><marker id="m-raw" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 z" fill="#5ccfa5"/></marker><marker id="m-waw" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 z" fill="#f2b45f"/></marker>
<style>
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
.t{font-size:14px;font-weight:600;fill:#e6eef8} .s{font-size:11px;fill:#9aa9c2}
.c{font-size:11.5px;font-weight:600;fill:#e6eef8} .cs{font-size:9.5px;fill:#9aa9c2}
.h{font-size:11px;font-weight:700;letter-spacing:.08em}
.i{font-size:12px;font-weight:700;fill:#e6eef8}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;fill:#e6eef8}
.l{font-size:10px;paint-order:stroke;stroke:#171c28;stroke-width:4px;stroke-linejoin:round}
</style></defs>
<rect width="1040" height="270" rx="12" fill="#171c28"/>
<text class="h" x="110" y="34" text-anchor="start" fill="#c3cee3">ARCHITECTURAL</text>
<text class="h" x="440" y="34" text-anchor="start" fill="#7aa2ff">PHYSICAL</text>
<text class="h" x="800" y="34" text-anchor="start" fill="#f2b45f">RENAME MAP</text>
<rect x="110" y="50" width="230" height="52" rx="8" fill="#1e2638" stroke="#c3cee3" stroke-width="1.6"/>
<text class="i" x="124" y="81" text-anchor="start">I1</text>
<text class="m" x="152" y="81">ADD <tspan fill="#f2b45f">x5</tspan>, x1, x2</text>
<rect x="440" y="50" width="230" height="52" rx="8" fill="#1e2638" stroke="#7aa2ff" stroke-width="1.6"/>
<text class="i" x="454" y="81" text-anchor="start">I1</text>
<text class="m" x="482" y="81">ADD <tspan fill="#5ccfa5">p8</tspan>, p1, p2</text>
<path d="M340,76 H440" fill="none" stroke="#a9b5cb" stroke-width="1.5" marker-end="url(#m-flow)" stroke-linejoin="round"/>
<rect x="110" y="120" width="230" height="52" rx="8" fill="#1e2638" stroke="#c3cee3" stroke-width="1.6"/>
<text class="i" x="124" y="151" text-anchor="start">I2</text>
<text class="m" x="152" y="151">SUB x6, <tspan fill="#f2b45f">x5</tspan>, x3</text>
<rect x="440" y="120" width="230" height="52" rx="8" fill="#1e2638" stroke="#7aa2ff" stroke-width="1.6"/>
<text class="i" x="454" y="151" text-anchor="start">I2</text>
<text class="m" x="482" y="151">SUB p9, <tspan fill="#5ccfa5">p8</tspan>, p3</text>
<path d="M340,146 H440" fill="none" stroke="#a9b5cb" stroke-width="1.5" marker-end="url(#m-flow)" stroke-linejoin="round"/>
<rect x="110" y="190" width="230" height="52" rx="8" fill="#1e2638" stroke="#c3cee3" stroke-width="1.6"/>
<text class="i" x="124" y="221" text-anchor="start">I3</text>
<text class="m" x="152" y="221">ADD <tspan fill="#f2b45f">x5</tspan>, x4, x7</text>
<rect x="440" y="190" width="230" height="52" rx="8" fill="#1e2638" stroke="#7aa2ff" stroke-width="1.6"/>
<text class="i" x="454" y="221" text-anchor="start">I3</text>
<text class="m" x="482" y="221">ADD <tspan fill="#b59bff">p10</tspan>, p4, p7</text>
<path d="M340,216 H440" fill="none" stroke="#a9b5cb" stroke-width="1.5" marker-end="url(#m-flow)" stroke-linejoin="round"/>
<text class="l" x="390" y="66" text-anchor="middle" fill="#a9b5cb">rename</text>
<path d="M110,76 H88 V146 H108" fill="none" stroke="#5ccfa5" stroke-width="1.5" marker-end="url(#m-raw)" stroke-linejoin="round"/>
<text class="l" x="80" y="115.0" text-anchor="middle" fill="#5ccfa5" transform="rotate(-90 80 115.0)">RAW</text>
<path d="M110,86 H58 V206 H108" fill="none" stroke="#f2b45f" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#m-waw)" stroke-linejoin="round"/>
<text class="l" x="46" y="146.0" text-anchor="middle" fill="#f2b45f" transform="rotate(-90 46 146.0)">WAW</text>
<path d="M670,76 H692 V146 H674" fill="none" stroke="#5ccfa5" stroke-width="1.5" marker-end="url(#m-raw)" stroke-linejoin="round"/>
<text class="l" x="702" y="115.0" text-anchor="start" fill="#5ccfa5">RAW stays</text>
<rect x="690" y="198" width="90" height="36" rx="5" fill="#262f47"/>
<text class="c" x="735" y="214" text-anchor="middle" fill="#f2b45f">WAW gone</text>
<text class="cs" x="735" y="227" text-anchor="middle">p8 ≠ p10</text>
<rect x="800" y="50" width="216" height="166" rx="8" fill="#1e2638" stroke="#f2b45f" stroke-width="1.6"/>
<text class="t" x="816" y="74" text-anchor="start">x5 maps to</text>
<rect x="816" y="88" width="184" height="30" rx="5" fill="#262f47"/>
<text class="s" x="830" y="107" text-anchor="start">start</text>
<text class="c" x="986" y="108" text-anchor="end" fill="#a9b5cb">p5</text>
<rect x="816" y="128" width="184" height="30" rx="5" fill="#262f47"/>
<text class="s" x="830" y="147" text-anchor="start">after I1</text>
<text class="c" x="986" y="148" text-anchor="end" fill="#5ccfa5">p8</text>
<rect x="816" y="168" width="184" height="30" rx="5" fill="#262f47"/>
<text class="s" x="830" y="187" text-anchor="start">after I3</text>
<text class="c" x="986" y="188" text-anchor="end" fill="#b59bff">p10</text>
<path d="M908,120 V126" stroke="#a9b5cb" stroke-width="0"/>
</svg>